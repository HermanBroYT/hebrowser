name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK (для Android Gradle Plugin 8.2 нужен Java 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Даём права на выполнение скрипту Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Кешируем Gradle для ускорения сборок
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Собираем отладочный APK
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 6. Запускаем линтер (проверка кода)
      - name: Run lint
        run: ./gradlew lintDebug

      # 7. Сохраняем APK как артефакт (можно скачать со вкладки Actions)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
